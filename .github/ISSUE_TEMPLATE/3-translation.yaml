name: 🌍 Translation
description: "Correct a translation or report text that is still in English. Give it a short title, e.g. \"Turkish: Downloads footer cut off\"."
labels:
  - i18n
assignees:
  - efibalogh
body:
  - type: markdown
    attributes:
      value: >-
        Sparkle ships English, Japanese and Polish. Every other language is an
        unreviewed community translation, so corrections are expected.
        A correction needs no justification: if it reads wrong to you as a
        speaker of that language, it is wrong.


        Want to translate or review a whole language, or fix strings yourself?
        Follow [TRANSLATING.md](https://github.com/efibalogh/sparkle-ig/blob/main/TRANSLATING.md)
        instead. It needs no build.
  - type: input
    id: language
    attributes:
      label: Language
      placeholder: e.g. Romanian, or ro
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: What is wrong?
      options:
        - Wording is wrong or unnatural
        - Text describes the setting incorrectly
        - Text is still in English
        - Text is cut off or breaks the layout
        - Something else
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: Where does it appear?
      description: The screen in Sparkle, so the text can be found.
      placeholder: e.g. Settings > Downloads > Media Quality, the first footer
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Current text
      description: Copy what Sparkle shows today, or attach a screenshot.
    validations:
      required: true
  - type: textarea
    id: suggested
    attributes:
      label: Suggested text
      description: >-
        What it should say instead. If several strings are wrong in the same
        way, list them all here.
  - type: markdown
    attributes:
      value: '---'
  - type: checkboxes
    id: credit
    attributes:
      label: Credit
      options:
        - label: >-
            Credit me in README.md and the in-app About page if this is used
          required: false
