name: ✨ Feature Request
description: "Suggest a new feature or an improvement. Give it a short, specific title, e.g. \"Copy usernames from a story's Mentions list\"."
labels:
  - Feature
assignees:
  - efibalogh
body:
  - type: checkboxes
    id: before-start
    attributes:
      label: Before requesting
      options:
        - label: I searched existing issues and this hasn't been suggested yet
          required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Where in Instagram or Sparkle would it live?
      options:
        - Feed
        - Stories
        - Reels
        - Messages
        - Instants
        - Profile
        - Profile Analyzer
        - Gallery
        - Downloads
        - Interface
        - Notifications
        - Sparkle Settings
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What's missing
      description: The problem you run into, or what you'd like to be able to do.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: How it could work
      description: Optional. Only if you have a specific idea in mind.
  - type: textarea
    id: alternatives
    attributes:
      label: Workarounds or alternatives
      description: Optional. Anything you've tried or considered instead.
